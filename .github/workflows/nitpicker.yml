name: Nitpicker

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

  pull_request:
    types: [opened, reopened]
    branches: [gh/**/base]

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Do not comment on nightly builds PR
    if: ${{ github.event.pull_request.number != 26921 && github.repository_owner == 'pytorch' }}
    steps:
    - name: Checkout PyTorch
      uses: pytorch/pytorch/.github/actions/checkout-pytorch@3140565db6f9398c3c58351569945c1bd8d049ec # main
    - uses: ethanis/nitpicker@c102a39683a80c7db9065f8eab7de8b58871f946 # v1.6
      with:
        nitpicks: '.github/nitpicks.yml'
        token: "${{ secrets.GITHUB_TOKEN }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
